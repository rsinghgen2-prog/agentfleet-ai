services:
  postgres:
    image: postgres:15-alpine
    container_name: agentfleet-postgres
    environment:
      POSTGRES_DB: agentfleet
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      SEED_PASSWORD: ${SEED_PASSWORD:?Set SEED_PASSWORD in .env}
      ABC_SEED_PASSWORD: ${ABC_SEED_PASSWORD:?Set ABC_SEED_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/bootstrap.sql:/docker-entrypoint-initdb.d/00-bootstrap.sql:ro
      - ./database/schema.sql:/opt/agentfleet-database/01-platform-schema.sql:ro
      - ./database/tenant-template.sql:/opt/agentfleet-database/02-tenant-template.sql:ro
      - ./database/seed-data-v2.sql:/opt/agentfleet-database/03-seed-data.sql:ro
    networks: [agentfleet-network]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agentfleet"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: agentfleet-redis
    ports:
      - "6379:6379"
    networks: [agentfleet-network]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: agentfleet-auth-service
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3001
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/agentfleet
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET in .env}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [agentfleet-network]
    restart: unless-stopped

  patient-service:
    build:
      context: ./patient-service
      dockerfile: Dockerfile
    container_name: agentfleet-patient-service
    ports:
      - "3010:3010"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3010
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/agentfleet
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [agentfleet-network]
    restart: unless-stopped

networks:
  agentfleet-network:
    driver: bridge

volumes:
  postgres_data: